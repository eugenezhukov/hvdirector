# HV Director - nginx reverse proxy (TLS termination, static UI, API, console WebSocket)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/hvdirector/tls/server.crt;
    ssl_certificate_key /etc/hvdirector/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hvd:10m;

    # Security headers: static locations include the snippet; API responses carry
    # their own headers from the application.
    root /opt/hvdirector/app/frontend/dist;
    index index.html;

    # ISO uploads are sent in 16 MB chunks
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/hvdirector-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /console.html {
        include /etc/nginx/snippets/hvdirector-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/hvdirector-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
